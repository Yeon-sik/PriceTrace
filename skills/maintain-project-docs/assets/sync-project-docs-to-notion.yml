name: Validate and sync project documents

on:
  pull_request:
    paths:
      - docs/Project_Intro.md
      - docs/Project_Detail.md
      - docs/templates/PROJECT_INTRO_TEMPLATE.md
      - docs/templates/PROJECT_DETAIL_TEMPLATE.md
      - skills/maintain-project-docs/**
      - .github/workflows/sync-project-docs-to-notion.yml
  push:
    branches: [main]
    paths:
      - docs/Project_Intro.md
      - docs/Project_Detail.md
      - docs/templates/PROJECT_INTRO_TEMPLATE.md
      - docs/templates/PROJECT_DETAIL_TEMPLATE.md
      - skills/maintain-project-docs/**
      - .github/workflows/sync-project-docs-to-notion.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish main-branch documents after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notion-project-documents-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Verify the complete publication bundle is tracked
        run: |
          git ls-files --error-unmatch \
            .github/workflows/sync-project-docs-to-notion.yml \
            docs/Project_Intro.md \
            docs/Project_Detail.md \
            docs/templates/PROJECT_INTRO_TEMPLATE.md \
            docs/templates/PROJECT_DETAIL_TEMPLATE.md \
            skills/maintain-project-docs/SKILL.md \
            skills/maintain-project-docs/agents/openai.yaml \
            skills/maintain-project-docs/references/EVIDENCE_MODEL.md \
            skills/maintain-project-docs/scripts/validate-project-docs.mjs \
            skills/maintain-project-docs/scripts/sync-project-docs-to-notion.mjs \
            skills/maintain-project-docs/scripts/project-docs.test.mjs \
            skills/maintain-project-docs/assets/PROJECT_INTRO_TEMPLATE.md \
            skills/maintain-project-docs/assets/PROJECT_DETAIL_TEMPLATE.md \
            skills/maintain-project-docs/assets/sync-project-docs-to-notion.yml

      - name: Validate published project documents
        run: >-
          node skills/maintain-project-docs/scripts/validate-project-docs.mjs
          --require-tracked
          docs/Project_Intro.md
          docs/Project_Detail.md

      - name: Validate reusable templates
        run: >-
          node skills/maintain-project-docs/scripts/validate-project-docs.mjs
          --templates
          docs/templates/PROJECT_INTRO_TEMPLATE.md
          docs/templates/PROJECT_DETAIL_TEMPLATE.md

      - name: Test documentation automation
        run: node --test skills/maintain-project-docs/scripts/project-docs.test.mjs

  sync:
    needs: validate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Sync Intro and Detail to dedicated Notion mirror pages
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_INTRO_PAGE_ID: ${{ secrets.NOTION_INTRO_PAGE_ID }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_DETAIL_PAGE_ID: ${{ secrets.NOTION_DETAIL_PAGE_ID }}
        run: node skills/maintain-project-docs/scripts/sync-project-docs-to-notion.mjs --apply
