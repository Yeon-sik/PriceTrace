name: Restaurant component contract
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/test-purchase-price-sql.mjs'
      - 'scripts/verify-ocr-component-contract.mjs'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/restaurant-component-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2 --minWorkers=1
      - run: npm run test:purchase-sql
      - run: npm run build
