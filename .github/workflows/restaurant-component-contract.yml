name: Restaurant component contract
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.nvmrc'
      - 'docs/CLOUD_DEVELOPMENT.md'
      - 'scripts/verify-ocr-component-contract.mjs'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/restaurant-component-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/cloud-setup.sh
      - run: bash scripts/cloud-check.sh
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
